[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pillclear"
version = "0.1.0"
description = "年轻人智能用药安全助手 —— C 端 OTC 用药安全助手"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # openai 3.0 迁到 httpx2，respx（测试全程靠它拦截 HTTP）拦不住，
    # 会导致套件真打网络；待 respx 适配 httpx2 后再放开上限。
    "openai>=1.30,<3",
    "pyyaml>=6.0",
]
# 默认 SQLite 路径零外部依赖；psycopg + pgvector 仅 Postgres 路径需要，
# 装法：pip install -e ".[postgres]"（开发装法 pip install -e ".[dev]" 不含）。

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
]
dev = [
    "uvicorn[standard]>=0.30",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "httpx>=0.27",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]
# starlette 1.3+ 对 testclient 用 httpx 发弃用警告（推荐 httpx2），
# 属上游库迁移期行为，非本项目代码问题；待 fastapi 适配后移除。
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient.:UserWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "PLC",    # pylint convention（含 PLC0415，代码内 noqa 对应）
    "RUF",    # ruff 自有
]
ignore = [
    "E501",  # 行长交给 formatter，不在 lint 阶段拦截
    # 中文项目的标点（，。：「」）在 RUF001/2/3 眼里是"易混淆 Unicode"，属误报
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 惯用法：Depends/Query 作为默认参数是有意为之
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
# 测试里允许函数内 import（配合 monkeypatch/respx 场景）与未用解包（构造请求只验证副作用）
"tests/**" = ["PLC0415", "RUF059"]
